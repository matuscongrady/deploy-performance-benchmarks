{
  "frameworkVersion": "4.43.0",
  "plugins": [
    "./.benchmark-instrumentation/serverless-build-stage.cjs"
  ],
  "service": "bench-commerce-lambda-25",
  "provider": {
    "name": "aws",
    "runtime": "nodejs22.x",
    "region": "eu-west-1",
    "stage": "bench",
    "memorySize": 512,
    "timeout": 30
