{
  "frameworkVersion": "4.43.0",
  "service": "bench-commerce-lambda-5",
  "provider": {
    "name": "aws",
    "runtime": "nodejs22.x",
    "region": "eu-west-1",
    "stage": "bench",
    "memorySize": 512,
    "timeout": 30
  },
  "package": {
    "individually": true,
    "patterns": [
      "!app/check.mjs",
      "!app/workloads.json",
      "!app/package-lock.json",
      "!provider-plan.json",
      "!manifest.json",
      "!plan.json",
      "!qualification.json",
      "!qualifications.json",
      "!native-outputs.json",
      "!**/*.log",
      "!**/evidence/**",
      "!deployment/**",
      "!providers/**",
      "!docs/**",
      "!scripts/**",
      "!scenarios/**",
      "!.work/**",
      "!results/**"
    ]
  },
  "functions": {
    "report": {
      "handler": "fixtures/lambdas/handlers/report.handler",
      "name": "bench-commerce-lambda-5-bench-report"
    },
    "product-lookup": {
      "handler": "fixtures/lambdas/handlers/product-lookup.handler",
      "name": "bench-commerce-lambda-5-bench-product-lookup",
      "package": {
        "patterns": [
          "!node_modules/**"
        ]
      }
    },
    "cart-pricing": {
      "handler": "fixtures/lambdas/handlers/cart-pricing.handler",
      "name": "bench-commerce-lambda-5-bench-cart-pricing",
      "package": {
        "patterns": [
          "!node_modules/**"
        ]
      }
    },
    "create-order": {
      "handler": "fixtures/lambdas/handlers/create-order.handler",
      "name": "bench-commerce-lambda-5-bench-create-order",
      "package": {
        "patterns": [
          "!node_modules/**"
        ]
      }
    },
    "notification": {
      "handler": "fixtures/lambdas/handlers/notification.handler",
      "name": "bench-commerce-lambda-5-bench-notification",
      "package": {
        "patterns": [
          "!node_modules/**"
        ]
      }
    }
  },
  "build": {
    "esbuild": {
      "minify": true,
      "sourcemap": false,
      "external": [
        "pdfkit"
      ],
      "banner": {
        "js": "import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
      }
    }
  }
}
