      "!**/evidence/**",
      "!.parallel-functions/**",
      "!.benchmark-instrumentation/**",
      "!**/serverless-build-stage.cjs",
      "!**/build-timing.mjs",
      "!**/build-inputs.json",
      "!**/native-build-*.json*",
      "!deployment/**",
      "!providers/**",
      "!docs/**",
      "!scripts/**",
      "!scenarios/**",
      "!.work/**",
      "!results/**"
    ]
