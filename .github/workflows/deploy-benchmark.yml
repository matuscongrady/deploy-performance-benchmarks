name: Deploy the selected Git-push benchmark
on:
  push:
    branches: ['trial/**']
permissions:
  contents: read
jobs:
  deploy:
    if: vars.BENCH_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: bench-${{ vars.BENCH_PROVIDER }}-${{ vars.BENCH_APP_ID }}
      cancel-in-progress: false
    env:
      BENCH_CI_ENABLED: ${{ vars.BENCH_CI_ENABLED }}
      BENCH_PROVIDER: ${{ vars.BENCH_PROVIDER }}
      BENCH_APP_ID: ${{ vars.BENCH_APP_ID }}
      BENCH_STAGE: ${{ vars.BENCH_STAGE }}
      BENCH_REGION: ${{ vars.BENCH_REGION }}
      BENCH_AWS_ROLE_ARN: ${{ secrets.BENCH_AWS_ROLE_ARN }}
      BENCH_QUALIFICATION_JSON: ${{ secrets.BENCH_QUALIFICATION_JSON }}
      BENCH_CANDIDATE_ARTIFACT_URL: ${{ secrets.BENCH_CANDIDATE_ARTIFACT_URL }}
      BENCH_CANDIDATE_SHA256: ${{ vars.BENCH_CANDIDATE_SHA256 }}
      BENCH_CANDIDATE_ARTIFACT_TOKEN: ${{ secrets.BENCH_CANDIDATE_ARTIFACT_TOKEN }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
      - name: Validate the reviewed scenario before requesting cloud credentials
        id: selected
        run: node scripts/ci.mjs --validate-only
      - name: Restore caches only for the repeat-push test
        id: cache
        if: steps.selected.outputs.journey == 'git-repeat'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.selected.outputs.cache_paths }}
          key: ${{ steps.selected.outputs.cache_key }}
          restore-keys: ${{ steps.selected.outputs.cache_prefix }}
      - name: Fetch the reviewed candidate executable
        if: vars.BENCH_PROVIDER == 'candidate'
        run: node scripts/ci.mjs --fetch-candidate
      - name: Authenticate to the disposable AWS account through OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.BENCH_AWS_ROLE_ARN }}
          aws-region: ${{ vars.BENCH_REGION }}
          role-session-name: bench-${{ github.run_id }}
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Install pinned tools, update the existing application and verify it
        env:
          BENCH_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          BENCH_CACHE_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: node scripts/ci.mjs --run
      - name: Save caches for the next push
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.selected.outputs.cache_paths }}
          key: ${{ steps.selected.outputs.cache_key }}
      - name: Retain native logs and observed cache information
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ vars.BENCH_PROVIDER }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .work/ci-evidence/
          if-no-files-found: ignore
          retention-days: 14
