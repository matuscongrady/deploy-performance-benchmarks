services:
  - type: web
    name: bench-commerce-five-services-api
    runtime: node
    plan: starter
    rootDir: fixtures/containers/five-services/api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /version
    autoDeployTrigger: commit
